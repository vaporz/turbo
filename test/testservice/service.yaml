# Regenerating this fixture
#
#   turbo generate github.com/vaporz/turbo/test/testservice -r grpc   -I $PWD/test/testservice
#   turbo generate github.com/vaporz/turbo/test/testservice -r thrift -I $PWD/test/testservice
#
# file_root_path is joined with package_path, so it must point at a directory that
# contains package_path. This fixture was generated inside a GOPATH-like tree at
# /src. From a plain checkout, point it at a temporary one instead:
#
#   mkdir -p /tmp/gopath/src/github.com/vaporz
#   ln -sfn $PWD /tmp/gopath/src/github.com/vaporz/turbo
#   # set file_root_path to /tmp/gopath/src, run the two commands above, restore it
#
# The urlmapping below is the input the switchers are generated from: a service
# with no route here gets no branch in grpcswitcher.go. That is why /eat is listed
# even though no test drives it through this file.
config:
  file_root_path: /src
  package_path: github.com/vaporz/turbo/test/testservice
  http_port: 8085
  environment: production
  turbo_log_path: 
  grpc_service_name: TestService
  grpc_service_host: 127.0.0.1
  grpc_service_port: 50065
  thrift_service_name: TestService
  thrift_service_host: 127.0.0.1
  thrift_service_port: 50065

urlmapping:
  - GET /hello/{your_Name:[a-zA-Z0-9]+} TestService SayHello
  - GET /hello TestService SayHello
  - GET /hellointerceptor TestService SayHello
  - GET /hello_preprocessor TestService SayHello
  - GET /hello_postprocessor TestService SayHello
  - GET /hello_hijacker TestService SayHello
  - GET /hello_convertor TestService SayHello
  - POST /testjson TestService TestJson
  - POST /testjson/{StringValue:[a-zA-Z0-9]+}/{int32_value:[a-zA-Z0-9]+} TestService TestJson
  - POST /eat MinionsService Eat

interceptor:
  - GET /hello Test1Interceptor
preprocessor:
  - GET /hello preProcessor
postprocessor:
  - GET /hello postProcessor
